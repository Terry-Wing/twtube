[project]
name = "metube"
version = "0.1.0"
description = "Web GUI for youtube-dl (using yt-dlp) with playlist support"
requires-python = ">=3.13"
dependencies = [
    "aiohttp",
    "python-socketio>=5.0,<6.0",
    "yt-dlp[default,curl-cffi,deno]>=2026.8.19",
    "mutagen",
    "curl-cffi",
    "gmssl==3.2.2",
    "watchfiles",
    "python-telegram-bot>=21.0,<22.0",
    # Telegram MTProto：Bot API 的 getFile 只能下 ≤20MB，视频基本超限；
    # Telethon 用同一 bot token 登录可下到 2GB。python-socks 是它走 socks 代理的依赖。
    "telethon>=1.36,<2.0",
    "python-socks[asyncio]>=2.4",
]

[dependency-groups]
dev = [
    "pylint",
    "pytest>=8.0",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = [".", "app"]
addopts = "-v"