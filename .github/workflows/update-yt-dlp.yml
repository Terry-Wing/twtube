name: update-yt-dlp

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-yt-dlp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check and Update yt-dlp
        run: |
          python - << 'EOF'
          import json
          import re
          import urllib.request
          import subprocess
          import sys

          # 1. 获取 PyPI 线上最新 yt-dlp 版本
          url = "https://pypi.org/pypi/yt-dlp/json"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  latest_version = data['info']['version']
          except Exception as e:
              print(f"获取最新版本失败: {e}")
              sys.exit(1)

          print(f"PyPI 线上最新 yt-dlp 版本: {latest_version}")

          # 2. 读取并更新 pyproject.toml
          with open('pyproject.toml', 'r', encoding='utf-8') as f:
              content = f.read()

          # 匹配 yt-dlp[default,curl-cffi,deno] 或类似写法
          pattern = r'"yt-dlp\[default,curl-cffi,deno\](?:>=[0-9.]+)*"'
          replacement = f'"yt-dlp[default,curl-cffi,deno]>={latest_version}"'

          new_content, count = re.subn(pattern, replacement, content)

          if count == 0:
              # 备用匹配通用 yt-dlp
              pattern_general = r'"yt-dlp(?:\[[^\]]+\])?(?:>=[0-9.]+)*"'
              new_content, count = re.subn(pattern_general, replacement, content)

          if new_content == content:
              print(f"pyproject.toml 中的 yt-dlp 已经是最新版本 ({latest_version})，无需更新。")
              sys.exit(0)

          with open('pyproject.toml', 'w', encoding='utf-8') as f:
              f.write(new_content)

          print(f"已成功将 pyproject.toml 中的 yt-dlp 更新为 >= {latest_version}")

          # 3. 提交改动
          subprocess.run(["git", "config", "--global", "user.email", "updater@twtube"], check=True)
          subprocess.run(["git", "config", "--global", "user.name", "AutoUpdater"], check=True)
          subprocess.run(["git", "add", "pyproject.toml"], check=True)
          subprocess.run(["git", "commit", "-m", f"chore(deps): upgrade yt-dlp to {latest_version}"], check=True)
          subprocess.run(["git", "push"], check=True)
          print("新版本提交并推送成功！")
          EOF