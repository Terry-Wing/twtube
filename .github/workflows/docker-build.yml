name: 构建并推送私有 twtube 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7

      - name: 设置 Docker Buildx 构建器
        uses: docker/setup-buildx-action@v4

      - name: 登录到 GitHub 容器镜像库 (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 转换用户名小写
        id: repo_name
        run: |
          echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/twtube:latest" >> $GITHUB_ENV

      - name: 构建并推送到 GHCR 私有仓库
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max